[project]
name = "fashionclip-learning"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.0",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.16.1",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "kaggle>=2.2.4",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
